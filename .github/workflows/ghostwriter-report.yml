name: Ghost Writer project report

on:
  push:
    branches: [agent/designlab-v2-orchestrator]
    paths-ignore:
      - "ghostwriter-bridge.mjs"
      - ".github/workflows/ghostwriter-report.yml"
  workflow_dispatch:

jobs:
  report-designlab-v2:
    runs-on: ubuntu-latest
    env:
      GHOSTWRITER_ENDPOINT: https://theghostwriterv2.onrender.com
      GHOSTWRITER_PROJECT_ID: designlab-v2
      GHOSTWRITER_PROJECT_ORIGIN: new
      GHOSTWRITER_INGEST_SECRET: ${{ secrets.GHOSTWRITER_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Skip until ingest secret is configured
        if: ${{ env.GHOSTWRITER_INGEST_SECRET == '' }}
        run: echo "Ghost Writer reporting is installed but inactive until the GHOSTWRITER_INGEST_SECRET repository secret is added."

      - name: Bootstrap DesignLab V2 launch story
        if: ${{ github.event_name == 'workflow_dispatch' && env.GHOSTWRITER_INGEST_SECRET != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { sendGhostWriterEvent } from "./ghostwriter-bridge.mjs";
          await sendGhostWriterEvent({
            source: "github-actions-project-report",
            sourceEventId: "designlab-v2-project-start",
            type: "project.started",
            truthState: "in_progress",
            privacy: "content_eligible",
            contentEligible: true,
            title: "Started DesignLab V2",
            summary: "DesignLab V2 is a token-efficient, stage-gated app design tournament for Claude Code. It reconstructs what an existing app actually does, runs separate Architecture, UX and UI competitions with human winner selection, surfaces proposed feature changes for approval, and only then proceeds toward implementation and verification.",
            sourceReference: "https://github.com/simplebusiness26/DesignLabV2",
            payload: {
              projectOrigin: "new",
              branch: "agent/designlab-v2-orchestrator"
            }
          });
          NODE

      - name: Verify DesignLab V2 source
        if: ${{ github.event_name == 'push' }}
        run: npm run check

      - name: Report DesignLab V2 commits
        if: ${{ github.event_name == 'push' && env.GHOSTWRITER_INGEST_SECRET != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { sendGhostWriterEvent } from "./ghostwriter-bridge.mjs";

          const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const branch = String(payload.ref ?? "").replace(/^refs\/heads\//, "");
          for (const commit of payload.commits ?? []) {
            await sendGhostWriterEvent({
              source: "github-actions-project-report",
              sourceEventId: commit.id,
              type: "git.commit",
              truthState: "in_progress",
              privacy: "content_eligible",
              contentEligible: true,
              title: "DesignLab V2 development update",
              summary: commit.message,
              sourceReference: commit.url,
              payload: {
                branch,
                projectOrigin: "new"
              }
            });
          }

          await sendGhostWriterEvent({
            source: "github-actions-project-report",
            sourceEventId: `designlab-v2-check:${payload.after}`,
            type: "test.passed",
            truthState: "completed",
            privacy: "content_eligible",
            contentEligible: true,
            title: "DesignLab V2 verification passed",
            summary: "The DesignLab V2 source syntax verification completed successfully with npm run check.",
            sourceReference: `https://github.com/simplebusiness26/DesignLabV2/commit/${payload.after}`,
            payload: {
              branch,
              projectOrigin: "new"
            }
          });
          NODE
